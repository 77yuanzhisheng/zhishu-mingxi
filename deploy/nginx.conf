server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ { proxy_pass http://zhishu-mingxi-api:8000; include /etc/nginx/proxy_params; proxy_read_timeout 90s; }
    location /chat { proxy_pass http://zhishu-mingxi-api:8000; include /etc/nginx/proxy_params; proxy_read_timeout 90s; }
    location /kb/ { proxy_pass http://zhishu-mingxi-api:8000; include /etc/nginx/proxy_params; proxy_read_timeout 90s; }
    location /tools/ { proxy_pass http://zhishu-mingxi-api:8000; include /etc/nginx/proxy_params; proxy_read_timeout 90s; }
    location /docs { proxy_pass http://zhishu-mingxi-api:8000; include /etc/nginx/proxy_params; }
    location /openapi.json { proxy_pass http://zhishu-mingxi-api:8000; include /etc/nginx/proxy_params; }
    location / { try_files $uri $uri/ /index.html; }
}
