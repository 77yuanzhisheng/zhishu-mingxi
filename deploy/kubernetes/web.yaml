apiVersion: v1
kind: Service
metadata:
  name: zhishu-mingxi-web
  namespace: zhishu-mingxi
  labels:
    app.kubernetes.io/name: zhishu-mingxi-web
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: zhishu-mingxi-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zhishu-mingxi-web
  namespace: zhishu-mingxi
  labels:
    app.kubernetes.io/name: zhishu-mingxi-web
    app.kubernetes.io/part-of: zhishu-mingxi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zhishu-mingxi-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zhishu-mingxi-web
        app.kubernetes.io/part-of: zhishu-mingxi
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: web
          image: 115.175.38.106:8079/zhishu-mingxi/web:REPLACE_AT_RELEASE
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
