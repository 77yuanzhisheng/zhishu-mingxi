apiVersion: v1
kind: Service
metadata:
  name: zhishu-mingxi-api
  namespace: zhishu-mingxi
  labels:
    app.kubernetes.io/name: zhishu-mingxi-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zhishu-mingxi-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zhishu-mingxi-api
  namespace: zhishu-mingxi
  labels:
    app.kubernetes.io/name: zhishu-mingxi-api
    app.kubernetes.io/part-of: zhishu-mingxi
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zhishu-mingxi-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zhishu-mingxi-api
        app.kubernetes.io/part-of: zhishu-mingxi
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: 115.175.38.106:8079/zhishu-mingxi/api:REPLACE_AT_RELEASE
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: CHROMA_PERSIST_DIR
              value: /state/chroma
            - name: LEARNING_DB_PATH
              value: /state/learning.db
            - name: EMBEDDING_DEVICE
              value: cpu
            - name: EMBEDDING_MODEL
              value: BAAI/bge-small-zh-v1.5
          envFrom:
            - secretRef:
                name: zhishu-mingxi-runtime
          volumeMounts:
            - name: state
              mountPath: /state
          resources:
            requests:
              cpu: "1000m"
              memory: "1536Mi"
            limits:
              cpu: "3000m"
              memory: "3Gi"
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: zhishu-mingxi-state
